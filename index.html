<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Line Upon Line — Creative Decor, Kits &amp; Workshops</title>
  
  <!-- Premium Web Font Integrations -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Bellefair&family=Darker+Grotesque:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@1,400&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Official Line Upon Line Brand Color Architecture */
      --peach: #F5DDCF;
      --rose: #A87570;
      --cloud: #EFEAE6;
      --mist: #D0C9B8;
      --gravel: #998979;
      --pebble: #C4AF9A;
      --sky: #CDD6D8;
      --ocean: #66767B;
      --forest: #5D6751;
      --white: #FFFFFF;
    }

    /* Core Reset & Screen Reader Accessibility Protocol */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--cloud); /* Tone-on-Tone Grounded Background */
      color: var(--gravel);
      font-family: 'Darker Grotesque', sans-serif; /* Paragraph Font */
      font-size: 21px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Strict Font Mapping Hierarchy */
    h1, .title-font {
      font-family: 'Bellefair', serif; /* Title Font */
      font-weight: 400;
      color: var(--gravel);
    }

    h2, h3, h4, .heading-font {
      font-family: 'Garamond', 'Garamond Premier Pro', serif; /* Heading Font */
      font-weight: 600;
      color: var(--rose);
    }

    .cta-font, nav a, button, .select-dropdown {
      font-family: 'Poppins', sans-serif; /* Menu / Call To Action Font */
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.85rem;
    }

    em, i, .editorial-italic {
      font-family: 'Libre Baskerville', serif; /* Italics Font */
      font-style: italic;
    }

    /* Skip Link for Screen Readers */
    .skip-link {
      position: absolute;
      top: -100px;
      left: 0;
      background: var(--rose);
      color: var(--white);
      padding: 12px;
      z-index: 200;
      text-decoration: none;
    }
    .skip-link:focus { top: 0; }

    /* Accessible Interactive Outlines */
    a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 3px solid var(--ocean);
      outline-offset: 2px;
    }

    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Announcement Bar */
    .announcement {
      background-color: var(--pebble);
      color: var(--white);
      text-align: center;
      padding: 10px 0;
      font-size: 0.85rem;
    }

    /* Sticky Navigation Architecture */
    header {
      background: var(--white);
      border-bottom: 1px solid var(--mist);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
    }

    /* Brand Logo Anchor Layout Configurations */
    .logo-img-anchor {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .brand-logo-img {
      height: 55px;        /* Keeps the navigation bar clean and aligned */
      width: auto;         /* Prevents horizontal distortion or stretching */
      display: block;
      object-fit: contain; /* Ensures the graphic scales correctly */
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 28px;
    }

    nav a {
      color: var(--gravel);
      text-decoration: none;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
    }

    nav a:hover, nav a.active {
      color: var(--rose);
      border-bottom-color: var(--rose);
    }

    /* Interactive Menu Trigger for Mobile ADA Compliance */
    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--gravel);
      font-size: 1.5rem;
      cursor: pointer;
    }

    /* Header & Layout Filters Hub */
    .hero-section {
      text-align: center;
      padding: 60px 0 20px;
    }

    .hero-section h1 {
      font-size: 3.5rem;
      margin-bottom: 10px;
    }

    .utility-control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--white);
      border: 1px solid var(--mist);
      padding: 16px 24px;
      border-radius: 6px;
      margin-bottom: 32px;
    }

    .dropdown-cluster {
      display: flex;
      gap: 16px;
    }

    .select-dropdown {
      background: var(--cloud);
      border: 1px solid var(--mist);
      color: var(--gravel);
      padding: 10px 16px;
      border-radius: 4px;
      cursor: pointer;
      text-transform: none;
    }

    /* Main Grid & Filtering Columns Split */
    .catalog-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 40px;
      margin-bottom: 80px;
    }

    .filter-drawer-sidebar h3 {
      font-size: 1.2rem;
      margin-bottom: 14px;
      color: var(--ocean);
      border-bottom: 1px solid var(--mist);
      padding-bottom: 6px;
    }

    .filter-group-block {
      margin-bottom: 32px;
    }

    .filter-item-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      font-size: 1.05rem;
    }

    .filter-item-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--rose);
    }

    /* Matrix Product Card Designs */
    .product-showcase-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 32px;
    }

    .product-card {
      background: var(--white);
      border: 1px solid var(--mist);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 20px rgba(153, 137, 121, 0.1);
    }

    .product-img-wrapper {
      width: 100%;
      height: 320px;
      background: var(--mist);
      overflow: hidden;
    }

    .product-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-meta-content {
      padding: 24px;
      text-align: center;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .product-meta-content h2 {
      font-size: 1.4rem;
      color: var(--gravel);
      margin-bottom: 8px;
      font-family: 'Darker Grotesque', sans-serif;
      font-weight: 600;
    }

    .product-price-label {
      font-size: 1.2rem;
      color: var(--rose);
      font-weight: 700;
      margin-bottom: 16px;
    }

    .btn-action {
      background: var(--ocean);
      color: var(--white);
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-action:hover {
      background: var(--forest);
    }

    /* UI Module: Interactive Workshop Booking Grid */
    .workshop-scheduler-section {
      background: var(--white);
      border: 1px solid var(--mist);
      border-radius: 8px;
      padding: 48px 32px;
      margin-bottom: 80px;
    }

    .scheduler-header {
      text-align: center;
      margin-bottom: 36px;
    }

    .scheduler-header h2 {
      font-size: 2.4rem;
      color: var(--rose);
      margin-bottom: 8px;
    }

    .calendar-matrix-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
    }

    .calendar-event-card {
      background: var(--cloud);
      border-left: 4px solid var(--rose);
      padding: 24px;
      border-radius: 0 6px 6px 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .event-date-badge {
      color: var(--forest);
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .calendar-event-card h3 {
      font-size: 1.5rem;
      color: var(--gravel);
      margin-bottom: 12px;
    }

    .event-meta-info {
      font-size: 1rem;
      margin-bottom: 16px;
      color: var(--gravel);
    }

    .btn-secondary {
      background: transparent;
      border: 2px solid var(--ocean);
      color: var(--ocean);
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: var(--ocean);
      color: var(--white);
    }

    /* SEO Component: Editorial Project Blog Page Array */
    .editorial-blog-container {
      margin-bottom: 80px;
    }

    .blog-header-title {
      text-align: center;
      font-size: 2.4rem;
      margin-bottom: 40px;
    }

    .editorial-columns-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 32px;
    }

    .editorial-story-card {
      background: var(--white);
      border: 1px solid var(--mist);
      border-radius: 6px;
      overflow: hidden;
    }

    .editorial-story-card .img-frame {
      height: 220px;
      background: var(--mist);
    }

    .editorial-story-card .img-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .story-body {
      padding: 24px;
    }

    .story-body h3 {
      font-size: 1.6rem;
      color: var(--gravel);
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .story-body p {
      font-size: 1.05rem;
      margin-bottom: 16px;
    }

    .story-link {
      color: var(--rose);
      text-decoration: none;
      font-weight: bold;
    }

    .story-link:hover {
      text-decoration: underline;
    }
