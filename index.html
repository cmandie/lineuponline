<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Line Upon Line, Co. - Complete Brand Reconstruction Prototype</title>
  
  <!-- Injecting Google Fonts specified in the Line Upon Line Brand Guidelines Font Stack -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Bellefair&family=Darker+Grotesque:wght@400;500;700&family=Libre+Baskerville:ital@1&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       LINE UPON LINE, CO. - OFFICIAL CONFIGURATION VARIABLE RECONSTRUCTION
       ========================================================================== */
    :root {
      /* Brand Color HEX Registry */
      --color-peach: #F5DDCF;
      --color-rose: #A87570;
      --color-cloud: #EFEAE6;
      --color-mist: #D0C9B8;
      --color-gravel: #998979;
      --color-pebble: #C4AF9A;
      --color-sky: #CDD6D8;
      --color-ocean: #66767B;
      --color-forest: #5D6751;
      
      /* Base Structural Grounding Rules */
      --text-charcoal: #1F2226;   /* Rich dark baseline for ADA AA Contrast (4.5:1+) */
      --bg-canvas: #FAF9F6;       /* Warm linen baseline backdrop layout */
      --pure-white: #FFFFFF;
      
      /* Typography Stack Registry */
      --font-cta: 'Poppins', sans-serif;                /* POPPINS MEDIUM */
      --font-title: 'Bellefair', serif;                 /* BELLEFAIR */
      --font-heading: 'Garamond Premier Pro', 'EB Garamond', 'Georgia', serif; /* GARAMOND PREMIER PRO */
      --font-paragraph: 'Darker Grotesque', sans-serif; /* DARKER GROTESQUE */
      --font-italic: 'Libre Baskerville', serif;        /* LIBRE BASKERVILLE ITALICS */
    }

    /* Base Formatting Defaults */
    body {
      font-family: var(--font-paragraph);
      font-size: 1.3rem; 
      line-height: 1.5;
      margin: 0;
      padding: 0;
      color: var(--text-charcoal);
      background-color: var(--bg-canvas);
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4 {
      font-family: var(--font-heading);
      font-weight: 400;
      margin: 0 0 1rem 0;
    }

    p {
      font-family: var(--font-paragraph);
      font-weight: 400;
      color: #3D4146;
      margin-top: 0;
    }

    .brand-script {
      font-family: var(--font-italic);
      font-style: italic;
      color: var(--color-rose);
    }

    /* ==========================================================================
       UX PATTERNS - PERFECTLY CENTERED LOGO & NAVIGATION FRAMEWORK (ADA-READY)
       ========================================================================== */
    .site-header {
      display: flex;
      flex-direction: column; 
      align-items: center;    
      padding: 2.2rem 5% 1.5rem 5%;
      background-color: var(--pure-white);
      border-bottom: 1px solid var(--color-cloud); /* Tone-on-Tone alignment bar */
      gap: 1.8rem;            
    }

    .logo-container {
      text-align: center;
      width: 100%;
    }

    .logo {
      font-family: var(--font-title);
      font-size: 2.4rem;     
      text-transform: uppercase;
      letter-spacing: 0.15em; 
      color: var(--text-charcoal);
      display: inline-block;
    }

    .nav-container {
      width: 100%;
      display: flex;
      justify-content: center; 
    }

    .nav-menu {
      list-style: none;
      display: flex;
      gap: 3.5rem;              
      margin: 0;
      padding: 0;
      justify-content: center;
    }

    .nav-menu a, .dropdown-trigger {
      font-family: var(--font-cta);
      font-weight: 500;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-charcoal);
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.5rem 0;
    }

    .has-dropdown { position: relative; }
    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: var(--pure-white);
      box-shadow: 0px 12px 30px rgba(31, 34, 38, 0.06);
      min-width: 280px;
      list-style: none;
      padding: 0.8rem 0;
      margin-top: 0.5rem;
      z-index: 10;
      border-top: 2px solid var(--color-pebble); /* Grounded asset marker border */
    }

    .dropdown-menu li a {
      display: block;
      padding: 0.8rem 1.5rem;
      font-size: 1.15rem;
      font-family: var(--font-paragraph);
      text-transform: none;
      letter-spacing: 0;
    }

    .dropdown-menu li a:hover, .dropdown-menu li a:focus {
      background-color: var(--color-cloud);
    }

    .has-dropdown.is-open .dropdown-menu { display: block; }

    /* ==========================================================================
       GRID SYSTEM & STRUCTURAL CONTENT CONTAINER LAYOUT
       ========================================================================== */
    .prototype-container {
      max-width: 1200px;
      margin: 5rem auto;
      padding: 0 5%;
    }

    .section-divider {
      font-family: var(--font-title);
      font-size: 2.4rem;
      border-bottom: 1px solid var(--color-mist);
      padding-bottom: 0.5rem;
      margin: 6rem 0 2.5rem 0;
      color: var(--color-gravel);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 3rem;
      margin-bottom: 4rem;
    }

    .product-card {
      background: var(--pure-white);
      border: 1px solid var(--color-cloud);
      display: flex;
      flex-direction: column;
      padding: 2.2rem;
      box-sizing: border-box;
    }

    /* Grounded Tone-On-Tone Presentation Blocks */
    .book-cover-mock {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
      text-align: center;
      padding: 1.5rem;
      box-sizing: border-box;
      border: 1px solid var(--color-mist);
    }

    .book-cover-mock span {
      font-family: var(--font-title);
      font-size: 1.8rem;
    }

    .meta-tag {
      font-family: var(--font-cta);
      font-size: 0.75rem;
      background: var(--pure-white);
      color: var(--text-charcoal);
      padding: 0.3rem 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 1rem;
      border: 1px solid var(--color-pebble);
    }

    .product-title {
      font-family: var(--font-heading);
      font-size: 1.9rem;
      margin: 0.5rem 0;
    }

    .product-price {
      font-family: var(--font-paragraph);
      font-weight: 700;
      font-size: 1.35rem;
      margin-bottom: 1rem;
      color: var(--color-gravel);
    }

    .spec-list {
      padding-left: 1.2rem;
      margin: 0 0 2rem 0;
      font-size: 1.15rem;
      color: #4A4E54;
      line-height: 1.4;
    }

    .spec-list li { margin-bottom: 0.5rem; }

    /* Color Selection Swatch Rows */
    .swatch-box { margin-bottom: 2rem; }
    .swatch-title {
      font-family: var(--font-cta);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.6rem;
      color: var(--color-gravel);
    }
    .swatch-row { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid var(--color-mist);
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .swatch:hover, .swatch:focus {
      transform: scale(1.15);
      outline: 2px solid var(--text-charcoal);
    }

    /* System Operational Action Buttons (Poppins Medium) */
    .action-btn {
      width: 100%;
      background-color: var(--text-charcoal);
      color: var(--pure-white);
      font-family: var(--font-cta);
      font-weight: 500;
      padding: 1.1rem;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      margin-top: auto;
      transition: background-color 0.2s ease;
    }

    .action-btn:hover, .action-btn:focus {
      background-color: var(--color-rose);
      outline: 3px solid #005a9c;
    }

    /* ==========================================================================
       SEO BLOG ARCHITECTURE CONTAINER
       ========================================================================== */
    .blog-showcase-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 3rem;
    }

    .blog-post-card {
      background-color: var(--pure-white);
      border: 1px solid var(--color-cloud);
      display: flex;
      flex-direction: column;
    }

    .blog-image-block {
      width: 100%;
      aspect-ratio: 16 / 10;
      background-color: var(--color-cloud);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-title);
      font-size: 1.4rem;
      color: var(--color-gravel);
      border-bottom: 1px solid var(--color-cloud);
    }

    .blog-content-block {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .blog-meta-date {
      font-family: var(--font-cta);
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--color-gravel);
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .blog-title {
      font-family: var(--font-heading);
      font-size: 1.7rem;
      margin: 0 0 1rem 0;
      line-height: 1.2;
    }

    .blog-excerpt {
      font-size: 1.15rem;
      color: #555960;
      line-height: 1.5;
