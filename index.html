<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Line Upon Line — Shop All</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bellefair&family=Darker+Grotesque:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@1,400&family=Poppins:wght@500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --peach: #F5DDCF;
      --rose: #A87570;
      --cloud: #EFEAE6;
      --mist: #D0C9B8;
      --gravel: #998979;
      --ocean: #66767B;
      --forest: #5D6751;
      --white: #FFFFFF;
      --dark-bg: #1f2428;
      --dark-card: #2b3237;
      --dark-text: #f3f3f3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--cloud);
      color: var(--gravel);
      font-family: 'Darker Grotesque', sans-serif;
      font-size: 18px;
      line-height: 1.5;
      transition: background 0.3s, color 0.3s;
    }

    body.dark {
      background-color: var(--dark-bg);
      color: var(--dark-text);
    }

    img { max-width: 100%; height: auto; }

    /* HEADER */
    header {
      background: var(--white);
      border-bottom: 1px solid var(--mist);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-logo-img {
      height: 40px;
      width: auto;
      object-fit: contain;
    }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1 1 220px;
      max-width: 360px;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--mist);
      border-radius: 4px;
      background: var(--cloud);
      font-size: 0.9rem;
    }

    .search-btn {
      padding: 8px 12px;
      background: var(--rose);
      color: var(--white);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 12px;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: var(--gravel);
      font-family: 'Poppins', sans-serif;
      font-size: 0.8rem;
      text-transform: uppercase;
      padding-bottom: 3px;
      border-bottom: 2px solid transparent;
    }

    nav a:hover {
      color: var(--rose);
      border-bottom-color: var(--rose);
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 1.6rem;
      color: var(--gravel);
      cursor: pointer;
    }

    .dark-toggle {
      border: 1px solid var(--mist);
      border-radius: 20px;
      padding: 6px 10px;
      font-size: 0.8rem;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      background: var(--cloud);
    }

    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 16px 40px;
    }

    h1 {
      text-align: center;
      margin: 24px 0 16px;
      font-family: 'Bellefair', serif;
      font-size: 2.2rem;
    }

    /* FILTER BAR */
    .sticky-filters {
      position: sticky;
      top: 70px;
      z-index: 50;
    }

    .utility-control-bar {
      background: var(--white);
      border: 1px solid var(--mist);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .dropdown-cluster {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .select-dropdown {
      background: var(--cloud);
      border: 1px solid var(--mist);
      padding: 8px 12px;
      border-radius: 4px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.8rem;
    }

    .category-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cat-btn {
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--mist);
      background: var(--cloud);
      font-family: 'Poppins', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .cat-btn.active {
      background: var(--rose);
      color: var(--white);
      border-color: var(--rose);
    }

    /* PRODUCT GRID */
    .product-showcase-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .product-card {
      background: var(--white);
      border: 1px solid var(--mist);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.15);
    }

    .product-img-wrapper {
      height: 220px;
      background: var(--mist);
    }

    .product-meta-content {
      padding: 12px;
      text-align: center;
    }

    /* ⭐ MOBILE VISIBILITY FIX */
    .product-meta-content h2 {
      font-size: 1.1rem;
      margin-bottom: 4px;
      color: #3a3a3a;
      font-weight: 700;
    }

    .product-price-label {
      font-size: 1rem;
      color: var(--rose);
      font-weight: 700;
      margin-bottom: 8px;
    }

    @media (max-width: 768px) {
      .product-meta-content h2 {
        color: #222 !important;
      }
      .product-price-label {
        color: #A87570 !important;
      }
    }

    body.dark .product-meta-content h2 {
      color: var(--dark-text) !important;
    }

    body.dark .product-price-label {
      color: var(--peach) !important;
    }
