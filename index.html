<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Line Upon Line — Creative Decor, Kits & Workshops</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bellefair&family=Darker+Grotesque:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@1,400&family=Poppins:wght@500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --peach: #F5DDCF;
      --rose: #A87570;
      --cloud: #EFEAE6;
      --mist: #D0C9B8;
      --gravel: #998979;
      --pebble: #C4AF9A;
      --sky: #CDD6D8;
      --ocean: #66767B;
      --forest: #5D6751;
      --white: #FFFFFF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--cloud);
      color: var(--gravel);
      font-family: 'Darker Grotesque', sans-serif;
      font-size: 21px;
      line-height: 1.5;
    }

    /* HEADER */
    header {
      background: var(--white);
      border-bottom: 1px solid var(--mist);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 1280px;
      margin: auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* SMALL LOGO SECTION — INSERT YOUR IMAGE NAME HERE */
    .brand-logo-img {
      height: 40px;   /* small logo */
      width: auto;
      object-fit: contain;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 20px;
    }

    nav a {
      text-decoration: none;
      color: var(--gravel);
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
    }

    nav a:hover {
      color: var(--rose);
      border-bottom-color: var(--rose);
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 1.8rem;
      color: var(--gravel);
      cursor: pointer;
    }

    /* MAIN WRAPPER */
    .wrap {
      max-width: 1280px;
      margin: auto;
      padding: 0 20px;
    }

    /* PRODUCT GRID */
    .product-showcase-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
      margin-bottom: 60px;
    }

    .product-card {
      background: var(--white);
      border: 1px solid var(--mist);
      border-radius: 6px;
      overflow: hidden;
      transition: 0.2s;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 20px rgba(153, 137, 121, 0.1);
    }

    .product-img-wrapper {
      height: 260px;
      background: var(--mist);
    }

    .product-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-meta-content {
      padding: 20px;
      text-align: center;
    }

    .product-meta-content h2 {
      font-size: 1.3rem;
      margin-bottom: 8px;
    }

    .product-price-label {
      font-size: 1.2rem;
      color: var(--rose);
      margin-bottom: 16px;
    }

    .btn-action {
      background: var(--ocean);
      color: var(--white);
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 4px;
      cursor: pointer;
    }

    /* WORKSHOP GRID */
    .calendar-matrix-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      margin-bottom: 60px;
    }

    .calendar-event-card {
      background: var(--cloud);
      border-left: 4px solid var(--rose);
      padding: 20px;
      border-radius: 6px;
    }

    /* BLOG GRID */
    .editorial-columns-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      margin-bottom: 60px;
    }

    .editorial-story-card {
      background: var(--white);
      border: 1px solid var(--mist);
      border-radius: 6px;
      overflow: hidden;
    }

    .editorial-story-card .img-frame {
      height: 200px;
      background: var(--mist);
    }

    .editorial-story-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* MOBILE FIXES */
    @media (max-width: 768px) {
      nav ul {
        display: none;
        flex-direction: column;
        background: var(--white);
        padding: 20px;
        border: 1px solid var(--mist);
        width: 100%;
      }

      .menu-toggle {
        display: block;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="nav-container">
    <a href="#">
      <!-- INSERT YOUR LOGO FILE NAME HERE -->
      <img src="Line Upon Line-13.png" class="brand-logo-img" alt="Line Upon Line Logo">
    </a>

    <button class="menu-toggle">&#9776;</button>

    <nav>
      <ul>
        <li><a href="#">Shop All</a></li>
        <li><a href="#">Workshops</a></li>
        <li><a href="#">Makery Box</a></li>
        <li><a href="#">Print Shop</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="wrap">

  <h1 style="text-align:center; margin:40px 0;">Shop All</h1>

  <section class="product-showcase-grid">
    <!-- PRODUCT 1 -->
    <article class="product-card">
      <div class="product-img-wrapper">
        <img src="https://images.unsplash.com/photo-1513519245088-0e12902e5a38" alt="">
      </div>
      <div class="product-meta-content">
        <h2>Chubby 3D Easter Bunny</h2>
        <div class="product-price-label">£28.00</div>
        <button class="btn-action">Select Options</button>
      </div>
    </article>

    <!-- PRODUCT 2 -->
    <article class="product-card">
      <div class="product-img-wrapper">
        <img src="https://images.unsplash.com/photo-1543257580-7269da773bf5" alt="">
      </div>
      <div class="product-meta-content">
        <h2>Easter Tiered Tray Set</h2>
        <div class="product-price-label">£34.00</div>
        <button class="btn-action">Select Options</button>
      </div>
    </article>

    <!-- PRODUCT 3 -->
    <article class="product-card">
      <div class="product-img-wrapper">
        <img src="https://images.unsplash.com/photo-1509440159596-0249088772ff" alt="">
      </div>
      <div class="product-meta-content">
        <h2>Bubble Gum Machine Door Hanger</h2>
        <div class="product-price-label">£42.00</div>
        <button class="btn-action">Select Options</button>
      </div>
    </article>
  </section>

</main>

<script>
  const toggle = document.querySelector('.menu-toggle');
  const navMenu = document.querySelector('nav ul');

  toggle.addEventListener('click', () => {
    const isOpen = navMenu.style.display === 'flex';
    navMenu.style.display = isOpen ? 'none' : 'flex';
  });
</script>

</body>
</html>
